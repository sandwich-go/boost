# 渐进式 lint 策略：起步只开核心 linter，兼顾 boost 仓"通用工具库 + 多
# fork 代码"现实——fork 代码（xhash/nhash/jenkins / xsync/cond_test.go /
# misc/hrff）整体豁免，避免与上游 diff 失同步。
#
# 与姊妹仓 myproxy / dataserver 的 .golangci.yml 同 v2 schema 风格对齐。
# 跑 `make lint` 应零告警；CI 中 lint job 是硬约束（AGENTS.md §4.1.1）。
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: mod

linters:
  # 起步开"必须遵守"的核心 linter：
  #   - 正确性：govet / staticcheck / errcheck / unused / ineffassign
  #   - 风格：misspell
  #   - nolint 自治：nolintlint
  #
  # gocyclo 暂未启用（17 个 pre-existing 大 switch 函数：xconv 类型分发 /
  # xstrings.From / xtime/cron parser / xchan.process / xcopy.copyRecursive
  # 等，complexity 16-33），单独 PR 治理后再加入。
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nolintlint
    - staticcheck
    - unused

  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment 噪声极大、与可读性强相关，未来结构体大整理时再开。
        - fieldalignment
        # shadow 在 Go 项目里普遍 case-by-case 判断，先关。
        - shadow
        # inline analyzer (Go 1.23+) 报 "ioutil.ReadAll should be inlined" /
        # "reflect.Ptr should be inlined to reflect.Pointer" 等。这些是 stdlib
        # 现代化重写（io vs ioutil / reflect.Pointer vs Ptr），按 §2.4 应当
        # 单独 PR 治理，不混进 lint 接入 PR。
        - inline
    staticcheck:
      # 与 myproxy 一致：行为对齐 v1 的"只启 SA*"，禁 SA1019（deprecated API
      # 由独立 PR 治理；如 z/conv.go reflect.StringHeader 已迁 unsafe.String）。
      checks:
        - SA*
        - "-SA1019"
    unused:
      # field-writes-are-uses=true 让"只写不读的 struct 字段"也算使用。
      # boost 仓 xpool / xcontainer 大量 stats 字段属此类。
      field-writes-are-uses: true
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

  exclusions:
    # lax = 默认宽松模式，匹配 "Code generated ... DO NOT EDIT" 头部即视为
    # 生成文件。本仓 optiongen / gotemplate / stringer / mockgen 头部都有。
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # 测试文件放宽部分规则：表驱动 / setup helper / 显式 _ = 忽略错误
      # 在测试里普遍且合理。
      - path: _test\.go
        linters:
          - errcheck
          - gocyclo
          - ineffassign
          - staticcheck
      # generated 文件兜底：optiongen / gotemplate / stringer / mockgen
      - path: .*_optiongen\.go$
        linters:
          - errcheck
          - gocyclo
          - govet
          - staticcheck
          - unused
      - path: .*_string\.go$
        linters:
          - errcheck
          - gocyclo
          - govet
          - staticcheck
          - unused
      - path: .*_mock_test\.go$
        linters:
          - errcheck
          - gocyclo
          - govet
          - staticcheck
          - unused
      # gotemplate 生成文件（xcontainer 系列、xtime/wheel_map.go 等）：
      # 通常文件头有 "// generated by: gotemplate" 注释，被 generated:lax
      # 拦截；这里再兜底，按 boost 仓 gen_*.go 命名约定（非 _optiongen 的）
      - path: xcontainer/.*/gen_.*\.go$
        linters:
          - errcheck
          - gocyclo
          - govet
          - staticcheck
          - unused
      # fork 代码：xhash/nhash/jenkins/* 是 stdlib jenkins fork
      # （AGENTS.md §1 / §4.6 fork 不动）。整体豁免维持与上游 diff 一致。
      - path: xhash/nhash/jenkins/
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - misspell
          - staticcheck
          - unused
      # fork：xsync/cond_test.go 是 stdlib sync/cond_test.go fork
      - path: xsync/cond_test\.go
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - staticcheck
          - unused
      # fork：misc/hrff/* 是 LEB hrff fork（Copyright 2012-2013 Lawrence E. Bakst）
      - path: misc/hrff/
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - misspell
          - staticcheck
          - unused
      # vtproto 生成代码（xencoding/protobuf 子树）按 §1 fork 不动
      - path: xencoding/protobuf/
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - staticcheck
          - unused
      # types/internal/ 含 vitess mydecimal fork（mydecimal.go 4000+ 行）+
      # errors.go / helper.go 是其姊妹文件（错误码 / 辅助函数与 fork 文案绑定）。
      # 整体作为 fork 区域豁免。
      - path: types/internal/
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - misspell
          - staticcheck
          - unused
      # xdebug/internal/template2/ 是少数仍保留的 template2 用例（非泛型可
      # 表达，dependency 注册表）。generator 产物不 lint。
      - path: xdebug/internal/template2/
        linters:
          - errcheck
          - gocyclo
          - govet
          - staticcheck
          - unused
      # xcontainer/templates/ 是 gotemplate 模板源（非生成产物，但本身是
      # 模板片段，lint 规则不适用）
      - path: xcontainer/templates/
        linters:
          - errcheck
          - gocyclo
          - govet
          - ineffassign
          - staticcheck
          - unused
    paths:
      # 生成代码 / 三方产物不参与 lint
      - .*_optiongen\.go$
      - .*_string\.go$
      - .*\.pb\.go$
      - vendor
      - third_party
      # v2 默认值，保留兼容 preset 行为
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# formatters 段：gofmt / goimports
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sandwich-go/boost
  exclusions:
    generated: lax
    paths:
      # 与 linters.exclusions.paths 对齐 + fork 路径整体豁免
      - .*_optiongen\.go$
      - .*_string\.go$
      - .*\.pb\.go$
      - .*_mock_test\.go$
      - xhash/nhash/jenkins/
      - xsync/cond_test\.go
      - misc/hrff/
      - xencoding/protobuf/
      - types/internal/mydecimal\.go
      - xdebug/internal/template2/
      - xcontainer/templates/
      - xcontainer/.*/gen_.*\.go$
      - vendor
      - third_party
      - third_party$
      - builtin$
      - examples$
