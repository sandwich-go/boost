# boost 仓 CI：vet / build / test / race 是硬门槛（参考 AGENTS.md §4.1）
# lint 是软门槛（参考 AGENTS.md §4.5）：当前仓库未钉 .golangci.yml，
# 跑 lint 只是给信号，不阻断 PR
#
# 风格参考姊妹仓 myproxy 的 .gitlab-ci.yml，但 boost 在 GitHub 用 Actions。
# 不跑：docker e2e / chaos / fuzz —— boost 是库，没有这些场景。

name: ci

on:
  push:
    branches:
      - main
      - "*/develop"
      - "*/release"
      - "*/feat/*"
  pull_request:
    branches:
      - main
      - "*/develop"
      - "*/release"

# 同分支并发触发时只保留最新一次运行，省 runner 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGENTS.md §4.2：Go 版本钉 1.25.0 + toolchain 1.25.11；CI 用 1.25.x patch
  # 最新版（不影响主版本号语义）。下游 myproxy/dataserver 都已 1.25.x，与
  # boost 同步避免 stdlib CVE 长期 affecting。
  GO_VERSION: "1.25.x"

jobs:
  # ---------------------------------------------------------------------------
  # check：静态检查（vet + lint）
  # ---------------------------------------------------------------------------

  vet:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：vet 是硬门槛。仓内 ~22 处 vet noise 已系统性清理，
    # 剩余 ~20 处全在 fork 代码（xhash/nhash/jenkins / xsync/cond_test.go），
    # `make vet` 内置 fork 豁免（按 §4.6 fork 不动）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: make vet
        run: make vet

  lint:
    runs-on: ubuntu-latest
    # AGENTS.md §4.5：lint 暂未钉为硬约束。继续阻断 PR 会让"先合入再清"的
    # 渐进式接入策略落不了地。等仓库整体清干净后改成 hard gate。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2
          # 没有 .golangci.yml 时用默认规则集；接入 .golangci.yml 后这条会被忽略
          args: --timeout=5m

  # ---------------------------------------------------------------------------
  # build：所有子包编译通过
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...

  # ---------------------------------------------------------------------------
  # test：单测 + 覆盖率（不带 race，跑得快，并行度高）
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：当前 1.4/develop HEAD 有 3 个 pre-existing 包测试挂
    # （lru / misc/cloud / xpanic），需单独 PR 修复后再硬钉。-vet=off 跳过
    # test 自带的前置 vet（vet 已是独立 job），免重复触发那一组 vet noise。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test (cover)
        # -timeout=5m：boost 单测应远快于此，超时多半是 deadlock
        # -parallel=4：与 Makefile 的 test target 一致
        # -vet=off：vet 已独立 job，避免 test 重复触发 pre-existing vet noise
        run: go test ./... -vet=off -cover -timeout=5m -parallel=4
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          # boost 仓 cover target 写 coverage.out；CI 这里走 -cover 不写 profile，
          # 这条 upload 只在本地通过 `make cover` 后跑 CI 时才能上传，否则跳过
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # race：-race 是仓库硬约束（AGENTS.md §4.4）
  # ---------------------------------------------------------------------------

  race:
    runs-on: ubuntu-latest
    # AGENTS.md §4.4：race 是仓库硬门槛。pre-existing race 已系统性修完：
    # - xtime.SetNowProvider (commit f57991b)
    # - module.allAgents+ctx (commit b8f2162)
    # - xchan.UnboundedChan{Len,BufLen} value receiver (commit <本批>)
    # - xtime.TestTimerResetDispatcher 测试代码 race (commit <本批>)
    # 上游 lib race（vmihailenco/msgpack pool reuse）在 -race 模式 t.Skip。
    # misc/cloud TestCloud 在无 env 时早返，不阻断（CI 不设 RELEASE_CLOUD_*）。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        # -timeout=10m：race 会让测试慢 2-10x，给足预算
        # -count=1：禁 test cache，确保 race 检测器每次真跑
        # -vet=off：与 test job 同理
        run: go test -race ./... -vet=off -timeout=10m -count=1

  # ---------------------------------------------------------------------------
  # vuln：govulncheck call-graph 驱动，只报"代码路径真正会触发"的 CVE
  # ---------------------------------------------------------------------------

  vuln:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：vuln 是硬门槛。本仓 affecting CVE 数 = 0（go.mod
    # 已升 1.25.0 + toolchain 1.25.11，x/net v0.55.0）。imported / required
    # modules 层仍有 vuln 但 govulncheck call-graph 分析 "your code doesn't
    # appear to call"（库性质，下游业务 LR 自查）—— 不是 affecting，不阻断。
    #
    # govulncheck 在有 affecting CVE 时 exit code 非 0；其它非阻断告警走
    # stdout 不影响 exit code。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./... | tee govulncheck.out
      - name: upload govulncheck output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck
          path: govulncheck.out
          retention-days: 7
          if-no-files-found: ignore
