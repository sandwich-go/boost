# boost 仓 CI：vet / build / test / race / lint / vuln 全部硬门槛
# （参考 AGENTS.md §4.1 / §4.1.1）。
#
# 风格参考姊妹仓 myproxy 的 .gitlab-ci.yml，但 boost 在 GitHub 用 Actions。
# 不跑：docker e2e / chaos / fuzz —— boost 是库，没有这些场景。
#
# Action 版本钉到 Node 24 兼容（GitHub 9/16/2026 移除 Node 20 runner）：
#   actions/checkout@v6 / actions/setup-go@v6 / actions/upload-artifact@v7
#   golangci/golangci-lint-action@v9.2.1（v9 起 Node 24，仍支持 lint v2 schema）
#
# setup-go 用 go-version-file: go.mod 自动跟随 toolchain directive：
# go.mod 写 'toolchain go1.25.11'，CI 装 1.25.11（vuln 报的 stdlib CVE 都
# 在 1.25.11 backport 内）。原 'go-version: 1.25.x' 给的是当时最新 1.25
# patch 但不一定是 1.25.11，govulncheck 看 GOVERSION 报 4 处 stdlib CVE
# affecting—和本地（toolchain 自动拉 1.25.11）不一致。
#
# setup-go cache 关掉：boost 是工具库，go mod 依赖少，下载 < 5s；开 cache
# 反而偶发 'tar exit code 2 / Failed to restore' noise，不值。

name: ci

on:
  push:
    branches:
      - main
      - "*/develop"
      - "*/release"
      - "*/feat/*"
  pull_request:
    branches:
      - main
      - "*/develop"
      - "*/release"

# 同分支并发触发时只保留最新一次运行，省 runner 资源
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # AGENTS.md §4.2：Go 版本由 go.mod 'toolchain' directive 决定（当前
  # go1.25.11）。CI setup-go 用 go-version-file: go.mod 自动跟随，避免
  # 1.25.x 通配符 patch 漂移导致 vuln 检测结果与本地不一致。
  # 下游 myproxy / dataserver 都已 1.25.x，本仓 toolchain 升级时所有人
  # 一起升（独立 PR）。
  GO_VERSION_FILE: "go.mod"

jobs:
  # ---------------------------------------------------------------------------
  # check：静态检查（vet + lint）
  # ---------------------------------------------------------------------------

  vet:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：vet 是硬门槛。仓内 ~22 处 vet noise 已系统性清理，
    # 剩余 ~20 处全在 fork 代码（xhash/nhash/jenkins / xsync/cond_test.go），
    # `make vet` 内置 fork 豁免（按 §4.6 fork 不动）。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: make vet
        run: make vet

  lint:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：lint 是硬门槛。仓内 .golangci.yml v2 schema 落地，
    # 0 告警基线。fork 代码（xhash/nhash/jenkins / xsync/cond_test.go /
    # misc/hrff / xencoding/protobuf / types/internal/mydecimal /
    # xdebug/internal/template2 / xcontainer/templates）整体豁免（§4.6）。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: --timeout=5m

  # ---------------------------------------------------------------------------
  # build：所有子包编译通过
  # ---------------------------------------------------------------------------

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: go build
        run: go build ./...

  # ---------------------------------------------------------------------------
  # test：单测 + 覆盖率（不带 race，跑得快，并行度高）
  # ---------------------------------------------------------------------------

  test:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：test 是硬门槛。pre-existing FAIL 已系统性修完
    # （lru/xpanic 早前 PR；TestWorkerComparison 时序抖动 commit 309bba2）。
    # misc/cloud TestCloud 在无 env 时早返不阻断（CI 不设 RELEASE_CLOUD_*）。
    # -vet=off 跳过 test 自带的前置 vet（vet 已是独立 job）。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: go test (cover)
        # -timeout=5m：boost 单测应远快于此，超时多半是 deadlock
        # -parallel=4：与 Makefile 的 test target 一致
        # -vet=off：vet 已独立 job，避免 test 重复触发 pre-existing vet noise
        run: go test ./... -vet=off -cover -timeout=5m -parallel=4
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7
          # boost 仓 cover target 写 coverage.out；CI 这里走 -cover 不写 profile，
          # 这条 upload 只在本地通过 `make cover` 后跑 CI 时才能上传，否则跳过
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # race：-race 是仓库硬约束（AGENTS.md §4.4）
  # ---------------------------------------------------------------------------

  race:
    runs-on: ubuntu-latest
    # AGENTS.md §4.4：race 是仓库硬门槛。pre-existing race 已系统性修完：
    # - xtime.SetNowProvider (commit f57991b)
    # - module.allAgents+ctx (commit b8f2162)
    # - module.plugins (commit c046077)
    # - xchan.UnboundedChan{Len,BufLen} value receiver (commit 2fe37ec)
    # - xtime.TestTimerResetDispatcher 测试代码 race (commit 309bba2)
    # 上游 lib race（vmihailenco/msgpack pool reuse）在 -race 模式 t.Skip。
    # misc/cloud TestCloud 在无 env 时 t.Skipf 不阻断（CI 不设 RELEASE_CLOUD_*）。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: go test -race
        # -timeout=10m：race 会让测试慢 2-10x，给足预算
        # -count=1：禁 test cache，确保 race 检测器每次真跑
        # -vet=off：与 test job 同理
        run: go test -race ./... -vet=off -timeout=10m -count=1

  # ---------------------------------------------------------------------------
  # vuln：govulncheck call-graph 驱动，只报"代码路径真正会触发"的 CVE
  # ---------------------------------------------------------------------------

  vuln:
    runs-on: ubuntu-latest
    # AGENTS.md §4.1.1：vuln 是硬门槛。本仓 affecting CVE 数 = 0（go.mod
    # 已升 1.25.0 + toolchain 1.25.11，x/net v0.55.0）。imported / required
    # modules 层仍有 vuln 但 govulncheck call-graph 分析 "your code doesn't
    # appear to call"（库性质，下游业务 LR 自查）—— 不是 affecting，不阻断。
    #
    # govulncheck 在有 affecting CVE 时 exit code 非 0；其它非阻断告警走
    # stdout 不影响 exit code。
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./... | tee govulncheck.out
      - name: upload govulncheck output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: govulncheck
          path: govulncheck.out
          retention-days: 7
          if-no-files-found: ignore
